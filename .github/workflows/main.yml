name: Deploy Images to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Queue deploys rather than letting two pushes race for the :latest tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
      test:
        runs-on: ubuntu-latest
        steps:
          - name: 'Checkout GitHub Action'
            uses: actions/checkout@v7

          - name: 'Setup Node'
            uses: actions/setup-node@v7
            with:
              node-version: '24'
              cache: 'npm'

          - name: 'Install Dependencies'
            run: npm ci

          - name: 'Run Tests'
            run: npm test

      push-moviething-image:
        needs: test
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write
        steps:
          - name: 'Checkout GitHub Action'
            uses: actions/checkout@v7

          - name: 'Login to GitHub Container Registry'
            uses: docker/login-action@v4
            with:
              registry: ghcr.io
              username: ${{github.actor}}
              password: ${{secrets.GITHUB_TOKEN}}

          - name: 'Build Inventory Image'
            run: |
              docker build . \
                --tag ghcr.io/grahams/moviething:latest \
                --tag ghcr.io/grahams/moviething:${{ github.sha }}
              docker push ghcr.io/grahams/moviething:latest
              docker push ghcr.io/grahams/moviething:${{ github.sha }}
